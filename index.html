<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Luyện thi VSTEP Reading và Listening miễn phí, có đồng hồ đếm giờ, chấm điểm và lưu tiến độ trên trình duyệt."
    />
    <title>VSTEP Luyện thi – Reading & Listening</title>
    <script>
      try {
        const saved = JSON.parse(localStorage.getItem('vstep-theme') || '{}')
        const theme =
          saved?.state?.theme ||
          (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        document.documentElement.classList.toggle('dark', theme === 'dark')
        document.documentElement.style.colorScheme = theme
      } catch {
        /* Mặc định để CSS xử lý. */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
